<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Filter for Occult Glow -->
    <filter id="glove-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c82924" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="glove-leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221e28"/>
      <stop offset="50%" stop-color="#15121b"/>
      <stop offset="100%" stop-color="#0a080e"/>
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5df97"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a2b"/>
    </linearGradient>
    <linearGradient id="crimson-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#8a0c10"/>
    </linearGradient>
  </defs>

  <g filter="url(#glove-shadow)" stroke="url(#gold-stroke)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Sleeve Cuff (Bottom Base) -->
    <path d="M208 424 H304 C350 424, 388 436, 388 472 C388 496, 360 502, 304 502 H208 C152 502, 124 496, 124 472 C124 436, 162 424, 208 424 Z" fill="url(#glove-leather)"/>

    <!-- Wrist Strap Band -->
    <rect x="180" y="348" width="220" height="64" rx="32" fill="url(#glove-leather)"/>
    <path d="M320 348 C332 368, 332 392, 320 412" stroke="url(#gold-stroke)" stroke-width="10"/>

    <!-- Thumb -->
    <path d="M192 224 C132 204, 94 212, 92 248 C90 284, 136 328, 196 352" fill="url(#glove-leather)"/>

    <!-- Palm & Main Hand Body -->
    <path d="M188 224 H396 C408 260, 412 304, 404 352 H192 C184 304, 184 260, 188 224 Z" fill="url(#glove-leather)"/>

    <!-- Dorsal Reinforcement Pad -->
    <path d="M236 224 C260 268, 300 296, 396 296" fill="none" stroke="url(#gold-stroke)" stroke-width="12"/>
    <!-- Pad Capsule / Emblem -->
    <rect x="308" y="238" width="72" height="32" rx="16" fill="url(#crimson-core)" stroke="url(#gold-stroke)" stroke-width="8"/>

    <!-- Pinky Finger -->
    <path d="M352 224 V96 C352 64, 388 64, 388 96 V224" fill="url(#glove-leather)"/>

    <!-- Ring Finger -->
    <path d="M304 224 V58 C304 24, 344 24, 344 58 V224" fill="url(#glove-leather)"/>

    <!-- Middle Finger -->
    <path d="M248 224 V42 C248 10, 296 10, 296 42 V224" fill="url(#glove-leather)"/>
    <!-- Middle Finger Joint Detail -->
    <path d="M248 140 V172" stroke="url(#gold-stroke)" stroke-width="12"/>

    <!-- Index Finger -->
    <path d="M192 224 V80 C192 48, 240 48, 240 80 V224" fill="url(#glove-leather)"/>

  </g>
</svg>
